# 推送 v* 标签时构建签名的发布版 APK，并上传到该标签的 Release 草稿；
# 手动运行（workflow_dispatch）只构建并上传为 Actions 产物，用于在打标签前验证签名与构建。
# 首次配置与发布步骤见 docs/发布流程.md。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 签名密钥存放在 release 环境中，由环境的部署规则限制可读取密钥的分支与标签
    environment: release
    permissions:
      contents: write
    env:
      # 历届正式版的签名证书 SHA-256 指纹；签名不一致的安装包无法覆盖安装，必须在发布前拦截
      RELEASE_CERT_SHA256: 56489640acc69b9599bb196a51e47466c3bb366c26d87737e9cbe785a713b18e
      APK_OUTPUT_DIR: app/build/outputs/apk/release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # AGP 剥离原生库调试符号时只使用其默认版本的 NDK，缺失时不会自动下载，而是直接打包未剥离的库。
      # Runner 未预装该版本，需手动安装；升级 AGP 时同步更新为新版本的默认 NDK。
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::release 环境未配置 RELEASE_KEYSTORE_BASE64，参见 docs/发布流程.md"
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/release.jks"
          base64 --decode <<< "$RELEASE_KEYSTORE_BASE64" > "$keystore_path"
          echo "BILITOOLS_RELEASE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          BILITOOLS_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          BILITOOLS_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          BILITOOLS_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify version and signing certificate
        working-directory: ${{ env.APK_OUTPUT_DIR }}
        run: |
          # 文件名由 renameReleaseApks 按 versionName 生成，形如 BiliTools-v3.2-arm64-v8a.apk
          universal_apks=(BiliTools-v*-universal.apk)
          apk_version="${universal_apks[0]#BiliTools-}"
          apk_version="${apk_version%-universal.apk}"
          # 应用内更新按标签版本号匹配安装包文件名，两者不一致会导致用户无法下载更新
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$apk_version" ]]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 versionName（$apk_version）不一致"
            exit 1
          fi

          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          for apk in BiliTools-"$apk_version"-*.apk; do
            cert_sha256="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [[ "$cert_sha256" != "$RELEASE_CERT_SHA256" ]]; then
              echo "::error::$apk 的签名证书指纹为 ${cert_sha256:-空}，与正式版不一致"
              exit 1
            fi
            echo "$apk 签名校验通过"
          done

      - name: Upload APKs as workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliTools-${{ github.sha }}
          path: ${{ env.APK_OUTPUT_DIR }}/BiliTools-*.apk
          if-no-files-found: error
          retention-days: 7
          # APK 本身已是压缩包，再压缩只会拖慢上传
          compression-level: 0

      - name: Upload APKs to draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apks=("$APK_OUTPUT_DIR"/BiliTools-*.apk)
          # 重新运行时该标签的 Release 可能已存在（含草稿），此时覆盖其中的安装包
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apks[@]}" --clobber
          else
            # 草稿不会被应用内更新检查到，补全更新说明后再手动发布
            gh release create "$GITHUB_REF_NAME" "${apks[@]}" --draft --verify-tag --title "$GITHUB_REF_NAME"
          fi
